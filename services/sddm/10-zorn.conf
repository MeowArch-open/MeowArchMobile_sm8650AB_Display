# SDDM on zorn (Xiaomi Redmi K80, SM8650).
#
# DisplayServer=wayland: this panel is only ever driven through DRM/KMS here.
# kwin_wayland and Hyprland both work over it; an X11 greeter would have to go
# through modesetting for no benefit and has never been tested on this display.
[General]
DisplayServer=wayland

# The machine is a phone with no physical keyboard, so the greeter needs an
# on-screen one or the password field cannot be typed into at all.
#
# BOTH lines are needed and they do different things:
#
#   InputMethod is read by the *theme* (breeze's VirtualKeyboardLoader picks its
#   keyboard from it). This sddm build does NOT turn it into an environment
#   variable -- `strings /usr/bin/sddm` does not contain QT_IM_MODULE at all --
#   so on its own it leaves the greeter with no input method and no keyboard.
#
#   GreeterEnvironment is what actually puts QT_IM_MODULE in the greeter's
#   environment, which is what makes Qt load
#   platforminputcontexts/libqtvirtualkeyboardplugin.so and drives the
#   InputPanel added to pixel-dusk-city's Main.qml.
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QT_IM_MODULE=qtvirtualkeyboard

[Wayland]
# SDDM's own default here is weston, which is not installed. This box has kwin.
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
