# camss (qcom-camss) needs the camera clock controller (camcc-sm8650) for its
# power domains; without camcc it dies of the 30s deferred-probe timeout with
# "Failed to configure power domains: -110". camcc was missing from the tree at
# first boot (CONFIG_SM_CAMCC_8650 was off); now that it is installed, pull it in
# before camss so there is no load-order race.
softdep qcom-camss pre: camcc-sm8650
