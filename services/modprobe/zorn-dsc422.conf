# Drive the panel as the vendor does: DSC native 4:2:2 at 10 bits per component.
# Both come from Android's DSC_MAIN_CONF (mdss + 0x81130) reading 0x205402ca, and
# the UEFI panel description agrees on the chroma format (DSIDSCChromaFormat = 1,
# Qualcomm's enum for YUV 4:2:2). The vendor's own sde_hw_dsc_1_2.c confirms the
# bit positions: BIT(22) is native_422, BIT(21) is native_420.
options panel_xiaomi_o11_42_02_0a dsc_native_422=1 dsc_bpc=10

# msm side. The first four make DSC_0_ENC match the vendor register for register;
# all four were read out of work/tmp/spr-vendor/msm/sde_dsc_helper.c:
#
#   dsc_initial_lines=3    dpu_hw_dsc_1_2.c omits the command-mode line that the
#                          1.1 block adds
#   dsc_full_ich_prec=1    vendor sets ENC_DF_CTRL BIT(12) for bpc > 8
#   dsc_xmit_delay=256     hardcoded for O11_PANEL_PA (line 528); the standard
#                          4:2:2 table says 341
#   dsc_dec_delay=478      hardcoded for the same panel id (line 571)
#
# enable_spr=1 belongs in zorn-msm.conf, but install-display.sh rewrites that
# file from scratch every time it runs, so it is repeated here where it survives.
# SPR reorders subpixels in the DSPP; it was measured to have no effect on output
# back when the pipeline was 4:4:4, and it has no business being on.
#
# dsi_dsc_slice_per_pkt=2 is the one variable being tested this boot. mainline
# hardcodes one slice per DSI packet and says so in a comment; this panel's vendor
# tree asks for two (qcom,mdss-dsc-slice-per-pkt = <2>, DSIDSCSlicePerPacket 2 in
# the UEFI XML), which changes bytes_per_pkt from 720 to 1440 and pkt_per_line
# from 2 to 1.
options msm dsc_initial_lines=3 dsc_full_ich_prec=1 dsc_xmit_delay=256 dsc_dec_delay=478 enable_spr=1 dsi_dsc_slice_per_pkt=2
options drm_display_helper dsc_pps_bpp_double=1
options msm dsc_use_cdm=0

# 2026-09-05: the colour fault is fixed. The SPR sub-block is double buffered --
# writing its registers over AHB is not enough, the CTL has to flush it
# (CTL_DSPP_n_FLUSH bit 8) or the whole window stays shadowed and inactive.
# spr_flush already defaults to 1 in the module; pinned here so the thing this
# display depends on is written down next to enable_spr.
options msm spr_flush=1
